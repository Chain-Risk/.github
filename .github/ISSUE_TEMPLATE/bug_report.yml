name: Bug report
description: Report a reproducible defect in a Chain-Risk project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow the organization's
        SECURITY.md policy and use a private reporting channel.
  - type: input
    id: version
    attributes:
      label: Project version or commit
      description: Include the release version or commit SHA.
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go/runtime version, and relevant tooling.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, private keys, and personal data.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability report.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
